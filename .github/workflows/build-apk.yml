name: Build and Release Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./frontend
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: flutter build apk --release --dart-define=HF_TOKEN="$HF_TOKEN"

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p release-output
          cp frontend/build/app/outputs/flutter-apk/app-release.apk release-output/NurseAssist-AI-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NurseAssist-AI-release-apk
          path: release-output/NurseAssist-AI-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: release-output/NurseAssist-AI-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
